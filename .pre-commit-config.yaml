repos:
  # YAML formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending

  # Python linting and formatting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking with Pyright
  - repo: https://github.com/asottile/pyright-python
    rev: 1.1.356
    hooks:
      - id: pyright
        args: [--outputjson]
        additional_dependencies: ['sqlalchemy']

  # JavaScript/TypeScript with Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, json, yaml, markdown]
        files: ^(frontend/|.*\.(json|ya?ml|md)$)

  # Security scanning with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [--skip, B101]
        files: backend/

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-data, '{extends: default, rules: {line-length: {max: 120}, document-start: disable}}']
