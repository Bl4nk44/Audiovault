# Note: `pre-commit install` conflicts with the global core.hooksPath set by ggshield (~/.gitconfig).
# Run manually: `pre-commit run --all-files` or via CI.
# ggshield runs on git commit via its own global hook — no `pre-commit install` required.

# pre-commit.ci (GitHub app) runs only hooks that need no network access, API keys or project
# toolchains. The rest runs in GitHub Actions (ci.yml, security.yml) and locally.
ci:
  skip: [ggshield, semgrep, eslint-frontend, pylock-sync]

# Generated by the Aikido IDE plugin (rewritten on every run) — formatting hooks would fight it.
exclude: ^\.github/instructions/aikido_rules\.instructions\.md$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # tsconfig*.json are JSONC (comments/trailing commas) — valid for TypeScript, not for strict JSON
        exclude: ^frontend/tsconfig.*\.json$
      - id: detect-private-key
      - id: check-merge-conflict

  # Python — ruff (linting + formatting), config in pyproject.toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Secret scanning
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.56.0
    hooks:
      - id: ggshield

  # SAST — uses .semgrep.yml from project root.
  # `repo: local` (semgrep from `uv tool`), not the semgrep repo: its clone (~590 MiB) exceeds
  # the pre-commit.ci tier limit (100 MiB) and breaks the whole pre-commit.ci build.
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (SAST)
        entry: semgrep --config=.semgrep.yml --error --exclude=backend/tests
        language: system
        types_or: [python, javascript, ts, tsx]
        # pre-commit passes file names explicitly, and semgrep does not apply --exclude to named files
        exclude: ^backend/tests/

  # TypeScript/React — ESLint flat config
  - repo: local
    hooks:
      - id: eslint-frontend
        name: ESLint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.[jt]sx?$
        pass_filenames: false

      # Lock sync — pylock.toml must be regenerated when requirements.txt changes
      - id: pylock-sync
        name: pylock.toml in sync with requirements.txt
        entry: scripts/check-pylock-sync.sh
        language: system
        files: ^backend/requirements\.txt$
        pass_filenames: false
