[tool.semantic_release]
version_source = "tag"
commit_version_number = true
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "python scripts/update_versions.py {version}"


[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "chore"]

[project]
name = "audiovault"
description = "Self-hosted application for importing, managing, and downloading music from major streaming platforms"
version = "0.10.4"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
[tool.pyright]
include = ["backend/app"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "backend/.venv",
    "backend/tests",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = false
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
# Dodatkowe wyłączenia dla zgodności z poprzednią konfiguracją
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportArgumentType = "none"
reportGeneralTypeIssues = "none"
reportPrivateImportUsage = "none"
reportCallIssue = "none"
reportTypedDictNotRequiredAccess = "none"
reportReturnType = "none"
reportOptionalOperand = "none"
reportOperatorIssue = "none"
extraPaths = ["backend/app"]
