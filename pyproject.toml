[tool.semantic_release]
version_variable = [
    "backend/app/core/config.py:VERSION",
    "frontend/package.json:version"
]
version_file = "VERSION"
branch = "main"
upload_to_pypi = false
upload_to_release = true

commit_parser_options = { allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"], minor_tags = ["feat"], patch_tags = ["fix", "perf", "chore"] }
commit_message = "chore(release): v{version} [skip ci]"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N", "S", "C4"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
# Subsonic API uses camelCase parameters as per API specification
"backend/app/api/subsonic/*" = ["N803", "N815"]
"backend/app/schemas/subsonic/*" = ["N803", "N815"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
