[tool.semantic_release]
version_source = "tag"
commit_version_number = true
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "python scripts/update_versions.py {version}"


[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "chore"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N", "S", "C4"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
# Subsonic API uses camelCase parameters as per API specification
"backend/app/api/subsonic/*" = ["N803", "N815"]
"backend/app/schemas/subsonic/*" = ["N803", "N815"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
# Disable strict checks that conflict with SQLAlchemy ORM patterns
disable_error_code = ["assignment", "arg-type", "return-value", "union-attr", "index", "call-overload", "var-annotated", "no-any-return", "import-untyped", "attr-defined"]

[[tool.mypy.overrides]]
module = "app.db.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.api.subsonic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.test_slashes"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.list_routes"
ignore_errors = true

[tool.pyright]
include = ["backend/app"]
exclude = ["**/__pycache__", "**/node_modules", "backend/.venv", "backend/tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
