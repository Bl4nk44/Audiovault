# ==============================================
# Trivy Configuration
# ==============================================
# Comprehensive security scanner for vulnerabilities,
# misconfigurations, secrets, and license issues

# Scan settings
scan:
  # Scan for vulnerabilities in dependencies
  security-checks:
    - vuln
    - secret
    - config
    - license

  # File patterns to scan
  file-patterns:
    - "*.py"
    - "*.js"
    - "*.jsx"
    - "*.ts"
    - "*.tsx"
    - "*.json"
    - "*.yaml"
    - "*.yml"
    - "Dockerfile*"
    - "requirements*.txt"
    - "package*.json"

# Vulnerability settings
vulnerability:
  type:
    - os
    - library

  # Severity levels to report
  severity:
    - CRITICAL
    - HIGH
    - MEDIUM
    - LOW

  # Ignore unfixed vulnerabilities
  ignore-unfixed: false

# Secret scanning
secret:
  # Maximum file size to scan (in bytes)
  max-file-size: 5242880  # 5MB

# License scanning
license:
  # Forbidden licenses
  forbidden:
    - GPL-2.0
    - GPL-3.0
  # Severity for forbidden licenses
  severity: HIGH

# Database settings
db:
  # Skip DB update (set to false in CI to always update)
  skip-update: false
  # Update database on startup
  download-db-only: false

# Output settings
format: table

# Cache settings
cache:
  # Enable cache
  backend: fs
  # Cache directory
  dir: .trivy-cache

# Ignore file
ignorefile: .trivyignore

# Exit code
# Exit with code 1 if vulnerabilities are found
exit-code: 0  # Set to 1 in CI to fail on vulnerabilities

# Timeout
timeout: 5m

# Offline mode
offline-scan: false

# Skip directories
skip-dirs:
  - .venv
  - venv
  - node_modules
  - .git
  - __pycache__
  - dist
  - build
  - .next
  - coverage
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache

# Skip files
skip-files:
  - "*.pyc"
  - "*.pyo"
  - "*.log"
  - "*.sqlite"
  - "*.db"

# Python specific
python:
  # Enable Python dependency scanning
  enabled: true

# JavaScript/TypeScript specific  
javascript:
  # Enable JS dependency scanning
  enabled: true
