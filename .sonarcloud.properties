# SonarCloud Automatic Analysis configuration.
# Automatic Analysis ignores sonar-project.properties (that file is for the
# manual CLI scanner against the local SonarQube), so the analysis-scope
# settings that matter for the cloud quality gate must live here.

# Exclude generated/vendored/irrelevant paths from analysis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/public/gallery/**,**/__pycache__/**,**/*.cover,**/migrations/**,backend/verify_api.py

# Translation files are structurally near-identical by design (same key tree per
# locale). Exclude them from duplication detection so they don't fail the
# "Duplication on New Code" gate. Test files repeat fixture/arrange blocks by
# nature — exclude them from CPD too.
sonar.cpd.exclusions=**/i18n/locales/*.ts,**/tests/**,**/*.test.ts,**/*.test.tsx,**/test_*.py,**/*_test.py

# Tests
sonar.tests=frontend/src,backend/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test_*.py,**/*_test.py
