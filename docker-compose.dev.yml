# Developer override — adds local build and hot-reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Ports in dev mode:
#   Backend API:  http://localhost:8000
#   Frontend:     http://localhost:5173  (Vite dev server, not nginx)
#   API docs:     http://localhost:8000/docs
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: audiovault-backend-dev
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - BACKEND_CORS_ORIGINS=http://localhost:5173

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    image: audiovault-frontend-dev
    ports:
      - "5173:5173"
    environment:
      # Inside the container localhost is the frontend itself, so the Vite dev
      # proxy must reach the backend service by name (default localhost:8000 fails).
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
