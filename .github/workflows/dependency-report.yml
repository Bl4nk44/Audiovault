name: Weekly Dependency Report

on:
  schedule:
    # Every Monday at 9:00 AM CET (8:00 AM UTC)
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-updates:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==============================================
      # Backend (Python) Dependencies
      # ==============================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python outdated packages
        id: python-updates
        run: |
          cd backend
          pip install -r requirements.txt > /dev/null 2>&1
          echo "PYTHON_OUTDATED<<EOF" >> $GITHUB_OUTPUT
          pip list --outdated --format=columns >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ==============================================
      # Frontend (NPM) Dependencies
      # ==============================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check NPM outdated packages
        id: npm-updates
        run: |
          cd frontend
          npm install > /dev/null 2>&1
          echo "NPM_OUTDATED<<EOF" >> $GITHUB_OUTPUT
          npm outdated || true >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ==============================================
      # Security Vulnerabilities Check
      # ==============================================
      - name: Check Python security vulnerabilities
        id: python-audit
        run: |
          pip install pip-audit
          cd backend
          echo "PYTHON_VULNS<<EOF" >> $GITHUB_OUTPUT
          pip-audit -r requirements.txt --format json || true >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check NPM security vulnerabilities
        id: npm-audit
        run: |
          cd frontend
          echo "NPM_VULNS<<EOF" >> $GITHUB_OUTPUT
          npm audit --json || true >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ==============================================
      # Docker Base Image Updates
      # ==============================================
      - name: Check Docker base images
        id: docker-updates
        run: |
          echo "DOCKER_INFO<<EOF" >> $GITHUB_OUTPUT
          echo "Backend Dockerfile:" >> $GITHUB_OUTPUT
          grep "FROM" backend/Dockerfile >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Frontend Dockerfile:" >> $GITHUB_OUTPUT
          grep "FROM" frontend/Dockerfile >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ==============================================
      # Generate Report Issue
      # ==============================================
      - name: Create GitHub Issue with Report
        uses: actions/github-script@v7
        env:
          PYTHON_OUTDATED: ${{ steps.python-updates.outputs.PYTHON_OUTDATED }}
          NPM_OUTDATED: ${{ steps.npm-updates.outputs.NPM_OUTDATED }}
          PYTHON_VULNS: ${{ steps.python-audit.outputs.PYTHON_VULNS }}
          NPM_VULNS: ${{ steps.npm-audit.outputs.NPM_VULNS }}
          DOCKER_INFO: ${{ steps.docker-updates.outputs.DOCKER_INFO }}
        with:
          script: |
            const pythonUpdates = process.env.PYTHON_OUTDATED || '';
            const npmUpdates = process.env.NPM_OUTDATED || '';
            const pythonVulns = process.env.PYTHON_VULNS || '';
            const npmVulns = process.env.NPM_VULNS || '';
            const dockerInfo = process.env.DOCKER_INFO || '';

            const date = new Date().toISOString().split('T')[0];

            const issueBody = `## 📦 Weekly Dependency Update Report
            **Generated:** ${date}

            ### 🐍 Python Backend Dependencies

            #### Available Updates:
            \`\`\`
            ${pythonUpdates || 'No updates available'}
            \`\`\`

            #### Security Vulnerabilities:
            \`\`\`json
            ${pythonVulns || 'No vulnerabilities found'}
            \`\`\`

            ---

            ### 📦 NPM Frontend Dependencies

            #### Available Updates:
            \`\`\`
            ${npmUpdates || 'No updates available'}
            \`\`\`

            #### Security Vulnerabilities:
            \`\`\`json
            ${npmVulns || 'No vulnerabilities found'}
            \`\`\`

            ---

            ### 🐳 Docker Base Images

            \`\`\`
            ${dockerInfo || 'No Docker info available'}
            \`\`\`

            ---

            ### 📝 Action Items

            - [ ] Review and test backend dependency updates
            - [ ] Review and test frontend dependency updates
            - [ ] Check Docker base image updates on Docker Hub
            - [ ] Update dependencies manually if needed
            - [ ] Run full test suite after updates

            ### 🔗 Useful Links

            - [Backend Requirements](https://github.com/Bl4nk44/Audiovault/blob/main/backend/requirements.txt)
            - [Frontend Package.json](https://github.com/Bl4nk44/Audiovault/blob/main/frontend/package.json)
            - [Security Alerts](https://github.com/Bl4nk44/Audiovault/security/dependabot)

            ---

            *This report is automatically generated every Monday at 9:00 AM CET*
            *Close this issue after reviewing and updating dependencies*
            `;

            // Check if there's already an open report issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependency-report',
              per_page: 1
            });

            // Close previous report if exists
            if (issues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                state: 'closed'
              });
            }

            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📦 Dependency Update Report - ${date}`,
              body: issueBody,
              labels: ['dependency-report', 'dependencies']
            });

      # ==============================================
      # Summary
      # ==============================================
      - name: Generate Summary
        run: |
          echo "## 📦 Dependency Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A detailed report has been created as a GitHub Issue." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Stats" >> $GITHUB_STEP_SUMMARY
          echo "- Python packages checked ✅" >> $GITHUB_STEP_SUMMARY
          echo "- NPM packages checked ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Security audit completed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View the [Issues tab](https://github.com/Bl4nk44/Audiovault/issues?q=is%3Aissue+is%3Aopen+label%3Adependency-report) for details." >> $GITHUB_STEP_SUMMARY
