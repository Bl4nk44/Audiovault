name: Security Scanning

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev
  schedule:
    # Run security scans weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==============================================
  # Trivy Vulnerability Scanning
  # ==============================================
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'  # Don't fail the build

      - name: Archive Trivy FS results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-results-sarif
          path: trivy-results.sarif

      - name: Upload Trivy FS SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Run Trivy vulnerability scanner (filesystem JSON)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy FS JSON results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-results
          path: trivy-results.json

      - name: Run Trivy vulnerability scanner (dependencies)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          ignore-unfixed: false

  # ==============================================
  # Trivy Docker Image Scanning
  # ==============================================
  trivy-docker:
    name: Trivy Docker Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        image:
          - name: backend
            dockerfile: ./backend/Dockerfile
            context: .
          - name: frontend
            dockerfile: ./frontend/Dockerfile
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t audiovault-${{ matrix.image.name }}:test \
            -f ${{ matrix.image.dockerfile }} \
            ${{ matrix.image.context }}

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'audiovault-${{ matrix.image.name }}:test'
          format: 'sarif'
          output: 'trivy-docker-${{ matrix.image.name }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Archive Trivy Docker results (${{ matrix.image.name }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-docker-${{ matrix.image.name }}-sarif
          path: trivy-docker-${{ matrix.image.name }}.sarif

      - name: Upload Trivy Docker SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-docker-${{ matrix.image.name }}.sarif
          category: trivy-docker-${{ matrix.image.name }}

      - name: Run Trivy on Docker image (JSON)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'audiovault-${{ matrix.image.name }}:test'
          format: 'json'
          output: 'trivy-docker-${{ matrix.image.name }}.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Docker JSON results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-docker-${{ matrix.image.name }}
          path: trivy-docker-${{ matrix.image.name }}.json

  # ==============================================
  # Semgrep Static Analysis
  # ==============================================
  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep (SARIF — fails job on findings)
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            --verbose
        continue-on-error: true

      - name: Run Semgrep (JSON artifact)
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config auto \
            --json \
            --output semgrep-results.json
        continue-on-error: true

      - name: Upload Semgrep JSON results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Archive Semgrep SARIF results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results-sarif
          path: semgrep-results.sarif

      - name: Upload Semgrep SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  # ==============================================
  # Secret Scanning
  # ==============================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better secret detection

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          exit-code: '1'  # Fail on secrets

      - name: Archive secret scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-secrets-sarif
          path: trivy-secrets.sarif

      - name: Upload Trivy secrets SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

  # ==============================================
  # Socket.dev Supply Chain Scan (SCA)
  # ==============================================
  # Wykrywa malware, typosquat, ryzykowne/maintenance-risk deps w
  # package-lock.json (root) i pyproject.toml (backend). Uzupełnia Trivy
  # (znane CVE) o analizę supply chain. Wymaga sekretu SOCKET_CLI_API_TOKEN.
  socket-scan:
    name: Socket Supply Chain Scan
    runs-on: ubuntu-latest
    # Pomiń gdy brak sekretu (np. fork PR) — nie wywalaj buildu.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Socket CLI
        run: npm install -g @socketsecurity/cli

      - name: Run Socket CI scan
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}
        run: socket ci
        continue-on-error: true

  # ==============================================
  # License Compliance
  # ==============================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy license scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

  # ==============================================
  # Security Summary
  # ==============================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [trivy-scan, semgrep, secret-scan]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Prepare Email Body
        if: always()
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          RESULT_TRIVY: ${{ needs.trivy-scan.result }}
          RESULT_SEMGREP: ${{ needs.semgrep.result }}
          RESULT_SECRET: ${{ needs.secret-scan.result }}
        run: |
          REPORT_FILE="security-report.txt"
          echo "GitHub Security Scan Report" > $REPORT_FILE
          echo "===========================" >> $REPORT_FILE
          echo "Repository: ${GH_REPOSITORY}" >> $REPORT_FILE
          echo "Branch: ${GH_REF_NAME}" >> $REPORT_FILE
          echo "Commit: ${GH_SHA}" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "## Job Statuses" >> $REPORT_FILE
          echo "- Trivy Scan: ${RESULT_TRIVY}" >> $REPORT_FILE
          echo "- Semgrep Analysis: ${RESULT_SEMGREP}" >> $REPORT_FILE
          echo "- Secret Scan: ${RESULT_SECRET}" >> $REPORT_FILE
          echo "" >> $REPORT_FILE

          if [[ "${RESULT_SECRET}" == "failure" ]]; then
            echo "WARNING: Secrets detected in repository!" >> $REPORT_FILE
          fi

          echo "Full results are available in the job artifacts." >> $REPORT_FILE

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v4
        if: always() && (github.event_name == 'schedule' || needs.secret-scan.result == 'failure' || needs.trivy-scan.result == 'failure' || needs.semgrep.result == 'failure')
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GitHub Security Report: ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.MAIL_DESTINATION }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: file://security-report.txt

      - name: Job Failure Guard
        if: always()
        run: |
          if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            exit 1
          fi
