name: Security Scanning

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev
  schedule:
    # Run security scans weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ==============================================
  # Trivy Vulnerability Scanning
  # ==============================================
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'  # Don't fail the build
          ignore-unfixed: true  # Skip CVEs without an available patch

      - name: Archive Trivy FS results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-fs-results-sarif
          path: trivy-results.sarif

      - name: Upload Trivy FS SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Run Trivy vulnerability scanner (filesystem JSON)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy FS JSON results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('trivy-results.json') != ''
        with:
          name: trivy-fs-results
          path: trivy-results.json

      - name: Run Trivy vulnerability scanner (dependencies)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          ignore-unfixed: true

  # ==============================================
  # Trivy Docker Image Scanning
  # ==============================================
  trivy-docker:
    name: Trivy Docker Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write

    strategy:
      # Don't let one leg's registry failure cancel the other leg.
      fail-fast: false
      matrix:
        image:
          - name: backend
            dockerfile: ./backend/Dockerfile
            context: .
          - name: frontend
            dockerfile: ./frontend/Dockerfile
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Pre-pull base images (retry with jittered backoff)
        # public.ecr.aws returns 429 on anonymous pull rate limits (shared runner IPs).
        # Pull the FROM images separately so `docker build` finds them locally.
        env:
          DOCKERFILE: ${{ matrix.image.dockerfile }}
        run: |
          images=$(awk '
            toupper($1) == "FROM" {
              i = 2
              while ($i ~ /^--/) i++
              if (!($i in stage) && tolower($i) != "scratch") print $i
              if (toupper($(i + 1)) == "AS") stage[$(i + 2)] = 1
            }' "$DOCKERFILE" | sort -u)
          for image in $images; do
            for attempt in 1 2 3 4 5 6 7 8; do
              if docker pull "$image"; then
                continue 2
              fi
              delay=$(( attempt * 30 + RANDOM % 30 ))
              echo "docker pull $image failed (attempt $attempt/8), retrying in ${delay}s..."
              sleep "$delay"
            done
            echo "::error::docker pull $image failed after 8 attempts"
            exit 1
          done

      - name: Build Docker image
        env:
          IMAGE_NAME: audiovault-${{ matrix.image.name }}:test
          DOCKERFILE: ${{ matrix.image.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.image.context }}
        run: |
          for attempt in 1 2 3 4; do
            if docker build -t "$IMAGE_NAME" -f "$DOCKERFILE" "$BUILD_CONTEXT"; then
              exit 0
            fi
            echo "docker build failed (attempt $attempt/4), retrying..."
            sleep $(( attempt * 30 + RANDOM % 30 ))
          done
          exit 1

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: 'audiovault-${{ matrix.image.name }}:test'
          format: 'sarif'
          output: 'trivy-docker-${{ matrix.image.name }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true

      - name: Archive Trivy Docker results (${{ matrix.image.name }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles(format('trivy-docker-{0}.sarif', matrix.image.name)) != ''
        with:
          name: trivy-docker-${{ matrix.image.name }}-sarif
          path: trivy-docker-${{ matrix.image.name }}.sarif

      - name: Upload Trivy Docker SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles(format('trivy-docker-{0}.sarif', matrix.image.name)) != ''
        with:
          sarif_file: trivy-docker-${{ matrix.image.name }}.sarif
          category: trivy-docker-${{ matrix.image.name }}

      - name: Run Trivy on Docker image (JSON)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: 'audiovault-${{ matrix.image.name }}:test'
          format: 'json'
          output: 'trivy-docker-${{ matrix.image.name }}.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Docker JSON results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles(format('trivy-docker-{0}.json', matrix.image.name)) != ''
        with:
          name: trivy-docker-${{ matrix.image.name }}
          path: trivy-docker-${{ matrix.image.name }}.json

  # ==============================================
  # Semgrep Static Analysis
  # ==============================================
  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Semgrep (SARIF — fails job on findings)
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            --verbose
        continue-on-error: true

      - name: Run Semgrep (JSON artifact)
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config auto \
            --json \
            --output semgrep-results.json
        continue-on-error: true

      - name: Upload Semgrep JSON results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('semgrep-results.json') != ''
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Archive Semgrep SARIF results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          name: semgrep-results-sarif
          path: semgrep-results.sarif

      - name: Upload Semgrep SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  # ==============================================
  # Secret Scanning
  # ==============================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Full history for better secret detection

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          exit-code: '1'  # Fail on secrets

      - name: Archive secret scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('trivy-secrets.sarif') != ''
        with:
          name: trivy-secrets-sarif
          path: trivy-secrets.sarif

      - name: Upload Trivy secrets SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy-secrets.sarif') != ''
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

  # ==============================================
  # Socket.dev Supply Chain Scan (SCA)
  # ==============================================
  # Wykrywa malware, typosquat, ryzykowne/maintenance-risk deps w
  # package-lock.json (root) i pyproject.toml (backend). Uzupełnia Trivy
  # (znane CVE) o analizę supply chain. Wymaga sekretu SOCKET_CLI_API_TOKEN.
  socket-scan:
    name: Socket Supply Chain Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Pomiń gdy brak sekretu (np. fork PR) — nie wywalaj buildu.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Socket CLI
        run: npm install -g --ignore-scripts @socketsecurity/cli@1.1.102

      - name: Run Socket CI scan
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}
        run: socket ci
        continue-on-error: true

  # ==============================================
  # License Compliance
  # ==============================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy license scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

  # ==============================================
  # Security Summary
  # ==============================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [trivy-scan, semgrep, secret-scan]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Job Failure Guard
        if: always()
        run: |
          if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            exit 1
          fi
