name: Security Scanning

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # ==============================================
  # Trivy Vulnerability Scanning
  # ==============================================
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'  # Don't fail the build

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-filesystem'

      - name: Run Trivy vulnerability scanner (dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          ignore-unfixed: false

  # ==============================================
  # Trivy Docker Image Scanning
  # ==============================================
  trivy-docker:
    name: Trivy Docker Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        image:
          - name: backend
            dockerfile: ./backend/Dockerfile
            context: .
          - name: frontend
            dockerfile: ./frontend/Dockerfile
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t audiovault-${{ matrix.image.name }}:test \
            -f ${{ matrix.image.dockerfile }} \
            ${{ matrix.image.context }}

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'audiovault-${{ matrix.image.name }}:test'
          format: 'sarif'
          output: 'trivy-docker-${{ matrix.image.name }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-docker-${{ matrix.image.name }}.sarif'
          category: 'trivy-docker-${{ matrix.image.name }}'

  # ==============================================
  # Semgrep Static Analysis
  # ==============================================
  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep with custom rules
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            --verbose
        continue-on-error: true

      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep-results.sarif'
          category: 'semgrep'

      - name: Run Semgrep (console output)
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --config auto \
            --verbose
        continue-on-error: true

  # ==============================================
  # Secret Scanning
  # ==============================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better secret detection

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          exit-code: '1'  # Fail on secrets

      - name: Upload secret scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-secrets.sarif'
          category: 'trivy-secrets'

  # ==============================================
  # License Compliance
  # ==============================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy license scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

  # ==============================================
  # Security Summary
  # ==============================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [trivy-scan, semgrep, secret-scan]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Check job status
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trivy Scan**: ${{ needs.trivy-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Semgrep Analysis**: ${{ needs.semgrep.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Secret Scan**: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "⚠️ **WARNING**: Secrets detected in repository!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
