# Validate Claude Code configuration files for consistency and quality
name: Claude Code Config Validator

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
  push:
    branches:
      - main
    paths:
      - 'CLAUDE.md'
      - '.claude/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CLAUDE.md exists and is substantial
        run: |
          echo "Checking CLAUDE.md..."
          test -f CLAUDE.md || { echo "❌ CLAUDE.md missing"; exit 1; }
          lines=$(wc -l < CLAUDE.md)
          if [ "$lines" -lt 50 ]; then
            echo "⚠️ Warning: CLAUDE.md seems very short ($lines lines)"
          fi
          echo "✅ CLAUDE.md present ($lines lines)"

      - name: Check slash commands exist
        run: |
          echo "Checking .claude/commands/..."
          test -f .claude/commands/feature.md  || { echo "❌ Missing: .claude/commands/feature.md"; exit 1; }
          test -f .claude/commands/bugfix.md   || { echo "❌ Missing: .claude/commands/bugfix.md"; exit 1; }
          test -f .claude/commands/review.md   || { echo "❌ Missing: .claude/commands/review.md"; exit 1; }
          echo "✅ All slash commands present"

      - name: Check required sections in CLAUDE.md
        run: |
          echo "Checking required sections..."
          grep -q "## Stack"                        CLAUDE.md || { echo "❌ Missing section: Stack"; exit 1; }
          grep -q "## Struktura"                    CLAUDE.md || { echo "❌ Missing section: Struktura"; exit 1; }
          grep -q "## Komendy"                      CLAUDE.md || { echo "❌ Missing section: Komendy"; exit 1; }
          grep -q "## Język"                        CLAUDE.md || { echo "❌ Missing section: Język"; exit 1; }
          grep -q "## Wzorce i konwencje"           CLAUDE.md || { echo "❌ Missing section: Wzorce i konwencje"; exit 1; }
          grep -q "## Komendy projektu"             CLAUDE.md || { echo "❌ Missing section: Komendy projektu"; exit 1; }
          echo "✅ All required sections present"

      - name: Verify no secrets in Claude config files
        run: |
          echo "Checking for secrets in .claude/ and CLAUDE.md..."
          files="CLAUDE.md $(find .claude/ -name '*.md' -o -name '*.json' 2>/dev/null | tr '\n' ' ')"

          if echo "$files" | xargs grep -rE "(api[_-]?key|API[_-]?KEY)\s*[:=]\s*['\"]?[a-zA-Z0-9]{20,}" 2>/dev/null; then
            echo "❌ Found potential API keys!"
            exit 1
          fi
          if echo "$files" | xargs grep -rE "AKIA[0-9A-Z]{16}" 2>/dev/null; then
            echo "❌ Found potential AWS keys!"
            exit 1
          fi
          if echo "$files" | xargs grep -r "BEGIN.*PRIVATE KEY" 2>/dev/null; then
            echo "❌ Found private keys!"
            exit 1
          fi
          echo "✅ No secrets found"

      - name: Check markdown structure of slash commands
        run: |
          echo "Checking slash command structure..."
          for f in .claude/commands/*.md; do
            lines=$(wc -l < "$f")
            if [ "$lines" -lt 10 ]; then
              echo "⚠️ Warning: $f seems very short ($lines lines)"
            fi
            # Each command should have at least one checklist
            if ! grep -q "^\- \[" "$f"; then
              echo "⚠️ Warning: $f has no checklist items"
            fi
            echo "✅ $f OK ($lines lines)"
          done
