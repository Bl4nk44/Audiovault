name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bl4nk404/audiovault
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: bl4nk404/audiovault
          short-description: Your Personal Music Sanctuary - Self-hosted music downloader
          description: |
            Audiovault is a powerful, self-hosted application designed to import, manage, and download your music libraries from any major streaming platform directly to your local server.

            ## Supported Platforms
            - Spotify
            - YouTube
            - Deezer
            - SoundCloud
            - Apple Music
            - Tidal
            - Amazon Music

            ## Features
            - Download music from multiple streaming services
            - Personal Subsonic API server
            - Stream to mobile apps (Symfonium, Amperfy, DSub)
            - Auto-sync playlists
            - Smart fallback system

            ## Documentation
            Visit the wiki for complete documentation: https://github.com/Bl4nk44/Audiovault/wiki

            ## Support
            - GitHub Issues: https://github.com/Bl4nk44/Audiovault/issues
            - GitHub Discussions: https://github.com/Bl4nk44/Audiovault/discussions
            - Contributing: https://github.com/Bl4nk44/Audiovault/blob/main/CONTRIBUTING.md
