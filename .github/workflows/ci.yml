name: Multi-Platform CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend-lint:
    name: Backend Lint (Ruff/Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir --only-binary :all: --require-hashes -r pylock.toml
          # Pin ruff to match .pre-commit-config.yaml (ruff-pre-commit rev) so CI and
          # local pre-commit never diverge on lint/format/isort behavior.
          pip install --no-cache-dir --only-binary :all: ruff==0.15.12 mypy==2.3.0

      - name: Run Ruff Check
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Run Mypy
        run: |
          cd backend
          mypy . --ignore-missing-imports --follow-imports=silent

  backend-test:
    name: Backend Test (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: backend-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: audiovault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          pip install --no-cache-dir --only-binary :all: --require-hashes -r pylock.toml

      - name: Run Tests with Coverage
        env:
          PYTHONPATH: backend
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/audiovault_test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test_secret_key_for_ci_tests_only"
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --ignore-scripts

      - name: Run Lint
        run: |
          cd frontend
          npm run lint

  frontend-test:
    name: Frontend Test (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: frontend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --ignore-scripts

      - name: Run Tests and Coverage
        run: |
          cd frontend
          npm run coverage
