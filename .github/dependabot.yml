# ==============================================
# Dependabot Configuration for Audiovault
# ==============================================
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This configuration disables automatic PR creation.
# You will receive security alerts and can view available updates
# in the Security > Dependabot alerts tab.

version: 2
updates:
  # Frontend Dependencies (NPM)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    # Disable automatic PRs - only show alerts
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "frontend"

  # Backend Dependencies (PIP)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    # Disable automatic PRs - only show alerts
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "backend"

  # Backend Docker Base Image
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "docker"

  # Frontend Docker Base Image
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"
