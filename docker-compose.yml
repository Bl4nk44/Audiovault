services:
  backend:
    build:
      context: ./backend
    image: audiovault-backend
    container_name: audiovault-backend
    restart: always
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./downloads:/downloads
      - ./VERSION:/app/VERSION
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/audiovault
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audiovault-network

  frontend:
    build:
      context: ./frontend
    image: audiovault-frontend
    container_name: audiovault-frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./VERSION:/VERSION
    ports:
      - "3000:5173"
    depends_on:
      - backend
    networks:
      - audiovault-network

  db:
    image: postgres:16-alpine
    container_name: audiovault-db
    restart: always
    volumes:
      - audiovault-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=audiovault
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - audiovault-network

  redis:
    image: redis:7-alpine
    container_name: audiovault-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - audiovault-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - audiovault-network

networks:
  audiovault-network:
    driver: bridge

volumes:
  audiovault-db-data:
  audiovault-redis-data:
