services:
  backend:
    build:
      context: ./backend
    image: audiovault-backend
    container_name: audiovault-backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    volumes:
      - ./downloads:/downloads
      - ./VERSION:/app/VERSION

    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/audiovault
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
      - BACKEND_CORS_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audiovault-network

  frontend:
    # Use the same Dockerfile, but override command for dev
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    image: audiovault-frontend-dev
    container_name: audiovault-frontend
    restart: always
    # Run Vite in dev mode, listening on all interfaces
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - audiovault-network

  db:
    image: postgres:16-alpine
    container_name: audiovault-db
    restart: always
    volumes:
      - audiovault-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=audiovault
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - audiovault-network

  redis:
    image: redis:7-alpine
    container_name: audiovault-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - audiovault-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - audiovault-network

networks:
  audiovault-network:
    driver: bridge

volumes:
  audiovault-db-data:
  audiovault-redis-data:
