services:
  backend:
    build:
      context: ./backend
    image: audiovault-backend
    container_name: audiovault-backend
    restart: always
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./downloads:/downloads
      - ./VERSION:/app/VERSION
      - ./gluetun:/app/gluetun
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/audiovault
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audiovault-network

  frontend:
    build:
      context: ./frontend
    image: audiovault-frontend
    container_name: audiovault-frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./VERSION:/VERSION
    ports:
      - "3000:5173"
    depends_on:
      - backend
    networks:
      - audiovault-network

  db:
    image: postgres:16-alpine
    container_name: audiovault-db
    restart: always
    volumes:
      - audiovault-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=audiovault
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - audiovault-network

  redis:
    image: redis:7-alpine
    container_name: audiovault-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - audiovault-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - audiovault-network

  audiovault-vpn:
    image: qmcgaw/gluetun:latest
    container_name: audiovault-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8888:8888/tcp # HTTP Proxy
      - 9050:9050/tcp # Tor Proxy (via attached container)
    volumes:
      - ./gluetun:/gluetun
    env_file:
      - ./gluetun/wg_env
      - .env
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      # Proxy configurations
      - HTTPPROXY=on
      - HTTPPROXY_STEALTH=on
      - HTTPPROXY_LOG=on
      - SHADOWSOCKS=off
      # Networking
      - FIREWALL_VPN_INPUT_PORTS=9050 # Allow incoming Tor traffic
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: always
    networks:
      - audiovault-network

  audiovault-tor:
    image: osminogin/tor-simple:latest
    container_name: audiovault-tor
    restart: always
    network_mode: "service:audiovault-vpn"
    depends_on:
      - audiovault-vpn

networks:
  audiovault-network:
    driver: bridge

volumes:
  audiovault-db-data:
  audiovault-redis-data:
