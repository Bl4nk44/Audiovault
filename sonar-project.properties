sonar.projectKey=Audiovault
sonar.projectName=Audiovault
sonar.projectVersion=1.0
sonar.sources=backend,frontend/src
sonar.tests=frontend/src,backend/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test_*.py,**/*_test.py
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/public/gallery/**,**/__pycache__/**,**/*.cover,**/migrations/**,backend/verify_api.py
sonar.cpd.exclusions=**/i18n/locales/*.ts
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14
# sonar.token — podaj przez env: SONAR_TOKEN=xxx npx sonar-scanner
