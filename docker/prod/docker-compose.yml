services:
  backend:
    build:
      context: ./backend
    image: bl4nk404/audiovault:latest
    container_name: audiovault-backend
    restart: always
    # Default command from Dockerfile is optimized for production
    volumes:
      - ./downloads:/downloads
      - ./VERSION:/app/VERSION
      # No source code volume mount
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/audiovault
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
      - BACKEND_CORS_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audiovault-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: bl4nk404/audiovault-frontend:latest
    container_name: audiovault-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - audiovault-network

  db:
    image: postgres:16-alpine
    container_name: audiovault-db
    restart: always
    volumes:
      - audiovault-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=audiovault
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audiovault-network

  redis:
    image: redis:7-alpine
    container_name: audiovault-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audiovault-network

networks:
  audiovault-network:
    driver: bridge

volumes:
  audiovault-db-data:
